name: ecommerce_platform
description: Flutter E-Commerce Platform (Customer App + Admin Web Panel)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  fl_chart: ^0.68.0
  animations: ^2.0.11
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.5
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

# Run: dart run flutter_launcher_icons
# TODO: drop the real 1024x1024 app icon at assets/icons/app_icon.png before running.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
  windows:
    generate: false
